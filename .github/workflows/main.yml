name: Generate Snake Animation

on:
  # executa automaticamente 1x por dia
  schedule:
    - cron: "0 0 * * *"
  
  # permite rodar manualmente
  workflow_dispatch:
  
  # roda em cada push no branch principal
  push:
    branches:
      - main  # ou "master" se for esse o nome no seu repositório

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Gerar github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
